$schema: https://azuremlschemas.azureedge.net/latest/sweepJob.schema.json
type: sweep
display_name: amazon_review_sweep
experiment_name: amazon_review_training_experiment

trial:
  code: ../src
  command: >-
    python train.py
    --train_data ${{inputs.train_data}}
    --val_data ${{inputs.val_data}}
    --test_data ${{inputs.test_data}}
    --output ${{outputs.model_output}}
    --C ${{search_space.C}}
    --max_iter ${{search_space.max_iter}}
  environment: azureml:amazon-review-training-env@latest

inputs:
  train_data:
    type: uri_folder
    path: azureml:amazon_reviews_merged_features_train@latest
  val_data:
    type: uri_folder
    path: azureml:amazon_reviews_merged_features_val@latest
  test_data:
    type: uri_folder
    path: azureml:amazon_reviews_merged_features_test@latest

outputs:
  model_output:
    type: uri_folder

compute: azureml:cluster-feature-engineering

sampling_algorithm: random

search_space:
  C:
    type: uniform
    min_value: 0.01
    max_value: 10.0
  max_iter:
    type: choice
    values: [500, 1000, 2000]

objective:
  primary_metric: val_accuracy
  goal: maximize

limits:
  max_total_trials: 6
  max_concurrent_trials: 2